<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Management System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
  <main class="login-wrapper">
    <a class="logo-mark" href="index.html" aria-label="Back to home">M</a>
    <h1>Welcome Back!</h1>
    <p class="login-subtitle">Sign in to continue to your account.</p>

    <form class="login-card" id="login-form">
      <h2>Login to your account</h2>
      <p class="login-description">Enter your email and password to get started.</p>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <div class="password-heading">
          <label for="password">Password</label>
          <a href="#" id="forgot-password">Forgot password?</a>
        </div>

        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password"
            autocomplete="current-password" required>
          <button class="show-password" id="show-password" type="button">Show</button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember">
          <input type="checkbox" name="remember">
          Remember me
        </label>
      </div>

      <button class="login-submit" type="submit">Sign In</button>

      <p class="form-message" id="login-message" role="status" aria-live="polite"></p>

      <div class="login-bottom">
        Don't have an account?
        <a href="#" id="create-account">Create an account</a>
      </div>
    </form>

    <p class="login-footnote">
      © 2026 My Website. All rights reserved.
    </p>
  </main>

  <script src="script.js"></script>

  <script>
    document.querySelector('#forgot-password').addEventListener('click', function (event) {
      event.preventDefault();
      document.querySelector('#login-message').textContent =
        'Password recovery is not connected in this demo.';
    });

    document.querySelector('#create-account').addEventListener('click', function (event) {
      event.preventDefault();
      document.querySelector('#login-message').textContent =
        'Account registration is not connected in this demo.';
    });
  </script>
</body>

</html>
